name: Validate pull request boundary

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch trusted validator and pull-request data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --detach FETCH_HEAD
          git fetch --no-tags --depth=1 origin "$PR_SHA"
          git worktree add --detach "$RUNNER_TEMP/pull-request" FETCH_HEAD
          git diff --name-status "$BASE_SHA" "$PR_SHA" > "$RUNNER_TEMP/changes.txt"
      - name: Install trusted validator dependencies
        run: python3 -m pip install 'defusedxml==0.7.1' 'requests==2.34.2'
      - name: Validate untrusted knowledge contribution as data only
        id: contribution
        run: |
          if python3 "$GITHUB_WORKSPACE/scripts/validate_contribution.py" "$RUNNER_TEMP/pull-request" --changes "$RUNNER_TEMP/changes.txt"; then
            echo "kind=knowledge" >> "$GITHUB_OUTPUT"
          else
            echo "kind=non-knowledge" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject untrusted non-knowledge pull request
        if: steps.contribution.outputs.kind == 'non-knowledge' && github.event.pull_request.user.login != github.repository_owner
        run: exit 1
      - name: Validate trusted control-plane pull request without secrets
        if: steps.contribution.outputs.kind == 'non-knowledge' && github.event.pull_request.user.login == github.repository_owner
        working-directory: ${{ runner.temp }}/pull-request
        run: |
          python3 -m pip install .
          python3 -m unittest discover -s tests -v
