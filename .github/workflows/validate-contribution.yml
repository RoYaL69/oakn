name: Validate pull request boundary

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch trusted validator and pull-request data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --detach FETCH_HEAD
          git fetch --no-tags --depth=1 origin "$PR_SHA"
          git worktree add --detach "$RUNNER_TEMP/pull-request" FETCH_HEAD
          git diff --name-status "$BASE_SHA" "$PR_SHA" > "$RUNNER_TEMP/changes.txt"
      - name: Install trusted validator dependencies
        run: python3 -m pip install 'defusedxml==0.7.1' 'requests==2.34.2' 'univers==32.0.1'
      - name: Validate untrusted knowledge contribution as data only
        id: contribution
        run: |
          if python3 "$GITHUB_WORKSPACE/scripts/validate_contribution.py" "$RUNNER_TEMP/pull-request" --changes "$RUNNER_TEMP/changes.txt"; then
            echo "kind=knowledge" >> "$GITHUB_OUTPUT"
          else
            echo "kind=non-knowledge" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch maintainer reviews for external control-plane pull request
        if: steps.contribution.outputs.kind == 'non-knowledge' && github.event.pull_request.user.login != github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > "$RUNNER_TEMP/reviews.json"
          curl --fail-with-body --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/collaborators?affiliation=all&per_page=100" \
            > "$RUNNER_TEMP/collaborators.json"
          python3 "$GITHUB_WORKSPACE/scripts/check_control_plane_approvals.py" \
            --reviews "$RUNNER_TEMP/reviews.json" \
            --collaborators "$RUNNER_TEMP/collaborators.json" \
            --head-sha "$HEAD_SHA"
      - name: Validate trusted control-plane pull request without secrets
        if: steps.contribution.outputs.kind == 'non-knowledge' && (github.event.pull_request.user.login == github.repository_owner || success())
        working-directory: ${{ runner.temp }}/pull-request
        run: |
          python3 -m pip install .
          python3 -m unittest discover -s tests -v
